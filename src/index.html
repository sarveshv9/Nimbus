<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nimbus — Premium Weather Experience</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A production-quality weather visualization platform built with modern Angular architecture, featuring immersive weather-driven theming, custom data visualizations, and responsive glassmorphic design."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nimbus" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Google Fonts: Outfit (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@200;300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Prevent FOUC: apply saved theme before Angular bootstraps -->
    <script>
      (function () {
        const saved = localStorage.getItem('nimbus-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Phosphor Icons CSS (Regular, Bold, Fill, Duotone) -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  </head>
  <body>
    <nimbus-root></nimbus-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
